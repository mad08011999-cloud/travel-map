name: Sync places (every 2 days)
on:
  schedule:
    - cron: '0 10 */2 * *'   # 10:00 UTC on odd days of the month = 3am PDT / 2am PST
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: places-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source repo (public)
        run: git clone --depth 1 https://github.com/poojithmalla8/travel-database.git /tmp/source
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rebuild places.json (keep coords, geocode only new places)
        run: python scripts/sync_places.py /tmp/source
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places.json scripts/geocode_cache.json 2>/dev/null || git add places.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Sync places from travel-database"
          git push
